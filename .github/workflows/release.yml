name: Release

# Tag-triggered release: push a tag like v0.3.4 and this builds the
# sdist + wheel and publishes them as a GitHub release with
# auto-generated notes. Upstream has no release automation, so this
# replaces the manual tag + hand-made release process.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
